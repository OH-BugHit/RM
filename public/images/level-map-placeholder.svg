<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="500"
     viewBox="0 0 800 500"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="bgGradient" cx="48%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#f7feff"/>
      <stop offset="45%" stop-color="#e8f6f8"/>
      <stop offset="78%" stop-color="#cfeaf0"/>
      <stop offset="100%" stop-color="#b7dfe8"/>
    </radialGradient>

    <linearGradient id="routeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#77b9c7"/>
      <stop offset="50%" stop-color="#9bc9c4"/>
      <stop offset="100%" stop-color="#82b5c6"/>
    </linearGradient>

    <pattern id="mapPattern"
             width="400" height="400"
             patternUnits="userSpaceOnUse">

      <!-- Hienovarainen tekninen taustaverkko -->
      <g fill="none"
         stroke="#477f8a"
         stroke-width="1.3"
         stroke-linecap="round"
         stroke-linejoin="round"
         opacity="0.12">
        <path d="M-20 90 H65 L105 130 H175 L220 85 H315 L355 125 H430"/>
        <path d="M-30 245 H75 L120 200 H205 L250 245 H330 L375 200 H430"/>
        <path d="M75 -20 V65 L115 105 V175 L75 215 V305 L115 345 V430"/>
        <path d="M285 -20 V55 L245 95 V155 L285 195 V275 L245 315 V430"/>
        <path d="M-20 335 H45 L85 295 H160 L200 335 H270"/>
      </g>

      <!-- Hitaasti liikkuvat valopulssit -->
      <g fill="none"
         stroke="#ffffff"
         stroke-width="2.5"
         stroke-linecap="round"
         stroke-dasharray="22 280"
         opacity="0.85">
        <path d="M-20 90 H65 L105 130 H175 L220 85 H315 L355 125 H430">
          <animate attributeName="stroke-dashoffset"
                   from="0" to="-600"
                   dur="14s" repeatCount="indefinite"/>
        </path>
        <path d="M-30 245 H75 L120 200 H205 L250 245 H330 L375 200 H430">
          <animate attributeName="stroke-dashoffset"
                   from="0" to="-600"
                   dur="19s" repeatCount="indefinite"/>
        </path>
        <path d="M75 -20 V65 L115 105 V175 L75 215 V305 L115 345 V430">
          <animate attributeName="stroke-dashoffset"
                   from="0" to="600"
                   dur="17s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Pienet hehkuvat solmut -->
      <g fill="#ffffff">
        <circle cx="105" cy="130" r="3">
          <animate attributeName="opacity"
                   values="0.25;0.95;0.25"
                   dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="220" cy="85" r="3">
          <animate attributeName="opacity"
                   values="0.3;1;0.3"
                   dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="250" cy="245" r="3">
          <animate attributeName="opacity"
                   values="0.25;0.9;0.25"
                   dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="115" cy="345" r="3">
          <animate attributeName="opacity"
                   values="0.2;0.85;0.2"
                   dur="5.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Hillityt geometriset yksityiskohdat -->
      <g fill="#ffffff" opacity="0.28">
        <polygon points="300,45 315,35 330,45 325,60 307,60"/>
        <polygon points="145,280 157,268 169,280 157,292"/>
        <polygon points="340,310 355,300 370,315 360,330 345,325"/>
      </g>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Tausta -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>

  <!-- Pehmeitä, maisemamaisia muotoja -->
  <path d="M0 350
           C100 300 145 370 250 325
           S420 300 520 350
           S700 390 800 315
           V500 H0 Z"
        fill="#ffffff" opacity="0.17"/>

  <path d="M0 415
           C140 370 220 430 340 395
           S570 370 660 420
           S750 435 800 400
           V500 H0 Z"
        fill="#9ccfcf" opacity="0.16"/>

  <!-- Toistuva verkkokuvio -->
  <rect width="800" height="500"
        fill="url(#mapPattern)"/>

  <!-- Hento keskialueen valo -->
  <ellipse cx="400" cy="250" rx="270" ry="175"
           fill="#ffffff" opacity="0.08"
           filter="url(#softGlow)"/>
</svg>