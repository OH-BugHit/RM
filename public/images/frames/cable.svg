<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="80">
  <defs>
    <style>
      /* Nykimätön 680px sykli */
      @keyframes pcbPulse {
        0% { stroke-dashoffset: 680; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pcbNodeGlow {
        0%, 100% { opacity: 0.3; r: 2.5px; }
        50% { opacity: 0.9; r: 4px; }
      }

      /* Kiinteät pohjajohtimet */
      .pcb-wire {
        stroke: #3a2f2a;
        stroke-width: 1.5px;
        opacity: 0.15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Animoidut valopulssit */
      .pcb-pulse {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 25 315;
        stroke: #ffffff;
        stroke-width: 2px;
        filter: drop-shadow(0px 0px 3px rgba(255, 255, 255, 0.8));
      }

      .pulse-1 { animation: pcbPulse 12s linear infinite; }
      .pulse-2 { animation: pcbPulse 16s linear infinite; animation-delay: -5s; }

      /* Sykkivät juotospisteet/solmut */
      .pcb-node {
        fill: #ffffff;
        animation: pcbNodeGlow 3s ease-in-out infinite;
      }
      .node-delay { animation-delay: -1.5s; }
    </style>
  </defs>

  <!-- KISKO 1: Suora pääjohto keskellä -->
  <path d="M 0,40 L 100,40 L 120,25 L 180,25 L 200,40 L 300,40" class="pcb-wire" />
  
  <!-- KISKO 2: Alempi rinnakkaisjohto mutkilla -->
  <path d="M 0,55 L 60,55 L 80,65 L 220,65 L 240,55 L 300,55" class="pcb-wire" />

  <!-- ANIMOOIDUT PULSSIT (Kulkevat johtimia pitkin) -->
  <path d="M 0,40 L 100,40 L 120,25 L 180,25 L 200,40 L 300,40" class="pcb-pulse pulse-1" />
  <path d="M 0,55 L 60,55 L 80,65 L 220,65 L 240,55 L 300,55" class="pcb-pulse pulse-2" />

  <!-- Juotospisteet / kytkentäkohdat mutkissa -->
  <circle cx="120" cy="25" class="pcb-node" />
  <circle cx="180" cy="25" class="pcb-node node-delay" />
  <circle cx="80" cy="65" class="pcb-node node-delay" />
  <circle cx="220" cy="65" class="pcb-node" />
</svg>
