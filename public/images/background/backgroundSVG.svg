<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Pehmeä beige-vihreä taustagradientti -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fdf9f3" />
      <stop offset="40%" stop-color="#f4ebe1" />
      <stop offset="80%" stop-color="#e2f0e3" />
      <stop offset="100%" stop-color="#d3ebd5" />
    </radialGradient>

    <!-- Saumaton kuvio (Pattern), joka toistuu koko ruudulla -->
    <pattern id="aiPattern" width="400" height="400" patternUnits="userSpaceOnUse">
      
      <!-- Piirilevyreitit (Circuit lines) - erittäin hienovaraiset -->
      <g stroke="#3a2f2a" stroke-width="1.2" opacity="0.08" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Reitti 1 -->
        <path d="M 0,100 L 80,100 L 120,60 L 220,60 L 260,100 L 320,100 L 360,140 L 400,140" />
        <circle cx="120" cy="60" r="3" fill="#3a2f2a" />
        <circle cx="260" cy="100" r="3" fill="#3a2f2a" />

        <!-- Reitti 2 -->
        <path d="M 40,200 L 100,200 L 140,240 L 180,240 L 220,200 L 300,200" />
        <circle cx="140" cy="240" r="3" fill="#3a2f2a" />
        
        <!-- Reitti 3 -->
        <path d="M 200,0 L 200,40 L 240,80 L 240,160 L 280,200 L 280,300 L 240,340 L 240,400" />
        <circle cx="240" cy="80" r="3" fill="#3a2f2a" />
        <circle cx="280" cy="200" r="3" fill="#3a2f2a" />

        <!-- Reitti 4 (Diagonal connection) -->
        <path d="M 300,300 L 340,340 L 400,340" />
        <path d="M 100,320 L 140,360 L 180,360" />
      </g>

      <!-- Hienovaraiset vaaleat valopisteet/kipinät (Glow dots) -->
      <g fill="#ffffff" opacity="0.6">
        <circle cx="120" cy="60" r="2" />
        <circle cx="260" cy="100" r="2" />
        <circle cx="140" cy="240" r="2" />
        <circle cx="240" cy="80" r="2" />
        <circle cx="50" cy="150" r="1.5" />
        <circle cx="330" cy="270" r="1.5" />
        <circle cx="180" cy="310" r="2" />
      </g>

      <!-- Kide-/geometriakuviot (Polygons) - erittäin matala opacity, ettei vie huomiota -->
      <g fill="#ffffff" opacity="0.25">
        <!-- Kide 1 -->
        <polygon points="80,50 90,40 100,50 95,65 85,65" />
        <!-- Kide 2 -->
        <polygon points="280,120 295,110 310,125 300,140 285,135" />
        <!-- Kide 3 -->
        <polygon points="150,280 160,265 175,275 170,295 155,295" />
      </g>
      
      <!-- Tummempi geometrinen aksentti (vihreän sävyyn sulautuva) -->
      <g fill="#2e5a32" opacity="0.03">
        <polygon points="85,45 95,55 88,62" />
        <polygon points="290,115 305,120 295,130" />
      </g>

    </pattern>
  </defs>

  <!-- Päätaustaväri -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Kuviointikerros taustavärin päällä -->
  <rect width="100%" height="100%" fill="url(#aiPattern)" />
</svg>
