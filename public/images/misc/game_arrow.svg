<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 260">

    <defs>

        <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffdf4f"/>
            <stop offset="45%" stop-color="#fff42a"/>
            <stop offset="100%" stop-color="#ffee00"/>
        </linearGradient>

        <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".65"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="gloss">
            <stop offset="0%" stop-color="white" stop-opacity="0"/>
            <stop offset="40%" stop-color="white" stop-opacity="0"/>
            <stop offset="50%" stop-color="white" stop-opacity=".9"/>
            <stop offset="60%" stop-color="white" stop-opacity="0"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="8"
                flood-color="#000000"
                flood-opacity=".45"/>
        </filter>

        <clipPath id="clip">
            <path d="
                M34 78
                Q18 78 18 94
                V166
                Q18 182 34 182
                H270
                C292 182 304 188 316 202
                L492 130
                L316 58
                C304 72 292 78 270 78
                Z"/>
        </clipPath>

    </defs>

    <g filter="url(#shadow)">

        <!-- Bounce -->
        <animateTransform
            attributeName="transform"
            type="scale"
            values="0.98;1;0.98"
            keyTimes="0;0.5;1"
            dur="2.2s"
            repeatCount="indefinite"/>

        <!-- Arrow -->
        <path
            d="
                M34 78
                Q18 78 18 94
                V166
                Q18 182 34 182
                H270
                C292 182 304 188 316 202
                L492 130
                L316 58
                C304 72 292 78 270 78
                Z"
            fill="url(#body)"
            stroke="#563000"
            stroke-width="10"
            stroke-linejoin="round"
            stroke-linecap="round"/>

        <!-- Top shine -->
        <path
            d="
                M42 86
                H266
                C286 86 298 90 308 102
                L454 130
                L308 88
                C298 82 286 78 266 78
                H42
                Z"
            fill="url(#shine)"
            opacity=".7"/>

        <!-- Inner highlight -->
        <path
            d="
                M34 78
                H270
                C292 78 304 72 316 58
                L492 130"
            fill="none"
            stroke="#FFF6C6"
            stroke-width="3"
            opacity=".8"
            stroke-linecap="round"/>

        <!-- Moving gloss -->
        <g clip-path="url(#clip)">

            <rect
                x="-600"
                y="-120"
                width="1200"
                height="500"
                fill="url(#gloss)"
                rx="30"
                transform="rotate(25)">

                <animateTransform
                    attributeName="transform"
                    type="translate"
                    from="-260 0"
                    to="720 0"
                    dur="1.8s"
                    repeatCount="indefinite"
                    additive="sum"/>

            </rect>

        </g>

    </g>

</svg>